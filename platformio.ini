; HexHound
; Cyber recon pet firmware for LilyGo T-Dongle S3
; https://github.com/h4d35x0/hexhound
; Build: pio run -e lilygo-t-dongle-s3
; Flash: pio run -e lilygo-t-dongle-s3 -t upload
; Monitor: pio device monitor -b 115200
; Docs: see docs/ directory

[platformio]
; Default build: firmware targets only.
; desktop-sim requires MinGW+SDL2 (Windows), desktop-sim-linux requires
; g++ + libsdl2-dev + pkg-config (Linux). native is test-only (pio test -e native)
default_envs = lilygo-t-dongle-s3-safe, t-dongle-s3-hid

[env:lilygo-t-dongle-s3]
; Pinned deliberately. Installing the C5's pioarduino platform from its git URL
; overwrites the UNPINNED `espressif32` slot in ~/.platformio/platforms (it
; publishes under the same platform name, currently version 55.x). Every env
; that said `platform = espressif32` then silently switched toolchains, and
; this family stopped building at all:
;   arduino.py: build_script_path = str(Path(FRAMEWORK_DIR) / ...)  -> None
; Pinning is what keeps a C5 bring-up from breaking the S3 builds.
platform = espressif32@6.12.0
board = dongles3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
board_build.cdc_on_boot = 1
extra_scripts =
    pre:scripts/patch_tft_espi.py
    pre:scripts/patch_arduino_sd.py
build_src_filter =
    +<*>
    -<serial_test.cpp>
    -<tft_test.cpp>
    -<tft_espi_test.cpp>
    -<lilygo_vendor_baseline.cpp>
    -<esp_lcd_st7735.c>
    -<hal/hal_sim.cpp>
    -<hal/sim_main.cpp>
    -<hal/sim_modules.cpp>

build_flags =
    ; T-Dongle S3 has 16MB flash, NO PSRAM - disable to prevent boot crash
    -DBOARD_HAS_PSRAM=0
    -DHEXHOUND_QUIET_OPTIONAL_SD=1
    ; Force FastLED software SPI - prevents FSPI bus conflict with TFT_eSPI
    -DFASTLED_FORCE_SOFTWARE_SPI
    ; TFT_eSPI configuration for T-Dongle S3 ST7735 (80x160)
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DST7735_GREENTAB160x80=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    ; Backlight - let TFT_eSPI manage GPIO 38 (matches working tft-test env).
    ; gpio_reset_pin(GPIO_NUM_38) in main.cpp clears PSRAM peripheral routing first.
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=4000000
    -DTFT_RGB_ORDER=TFT_BGR
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    ; APA102 RGB LED on T-Dongle S3
    -DLED_DATA_PIN=40
    -DLED_CLK_PIN=39
    -DNUM_LEDS=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^1.4.0

[env:lilygo-t-dongle-s3-safe]
; Safer default firmware for S3 bring-up.
; Leaves the display/UI enabled but disables APA102 LED traffic on GPIO 39/40,
; which can interfere with the backlight on GPIO 38.
extends = env:lilygo-t-dongle-s3
build_flags =
    ${env:lilygo-t-dongle-s3.build_flags}
    -DHEXHOUND_DISABLE_LED=1

[env:lilygo-t-dongle-s3-minimal]
; Raw SPI display test - bypasses TFT_eSPI and all modules.
extends = env:lilygo-t-dongle-s3
build_flags =
    ${env:lilygo-t-dongle-s3.build_flags}
    -DMINIMAL_BOOT

[env:lilygo-t-dongle-s3-softtft]
; Full firmware using the local ST7735 driver instead of TFT_eSPI.
; This keeps the proven T-Dongle S3 init sequence while avoiding the
; ESP32-S3 TFT_eSPI path that black-screened on this board.
extends = env:lilygo-t-dongle-s3-safe
build_flags =
    ${env:lilygo-t-dongle-s3-safe.build_flags}
    -DHEXHOUND_SOFT_TFT=1
lib_ignore =
    TFT_eSPI
lib_deps =
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^1.4.0

[env:lilygo-t-dongle-s3-softtft-debug]
; Post-setup diagnostic hold for isolating whether the full UI loop is what
; makes the soft-TFT build go black.
extends = env:lilygo-t-dongle-s3-softtft
build_flags =
    ${env:lilygo-t-dongle-s3-softtft.build_flags}
    -DHEXHOUND_SOFT_TFT_DEBUG_HOLD=1

[env:lilygo-t-dongle-s3-vendor-baseline]
; Clean LilyGo-style board validation target.
; Mirrors the official T-Dongle-S3 factory screen stack:
; - PlatformIO espressif32@6.12.0
; - esp_lcd ST7735 panel driver
; - SPI2_HOST panel bus
; - LilyGo landscape gap/swap/mirror settings
platform = espressif32@6.12.0
board = dongles3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<lilygo_vendor_baseline.cpp>
    +<esp_lcd_st7735.c>
lib_deps =

[env:lilygo-t-dongle-s3-vendor-app]
; Full HexHound firmware using LilyGo's working esp_lcd/ST7735 backend
; behind the local TFT wrapper. This keeps the UI code intact while moving
; the low-level panel path onto the vendor-proven stack.
platform = espressif32@6.12.0
board = dongles3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
board_build.cdc_on_boot = 1
extra_scripts = pre:scripts/patch_arduino_sd.py
build_src_filter =
    +<*>
    -<serial_test.cpp>
    -<tft_test.cpp>
    -<tft_espi_test.cpp>
    -<lilygo_vendor_baseline.cpp>
    -<hal/hal_sim.cpp>
    -<hal/sim_main.cpp>
    -<hal/sim_modules.cpp>
build_flags =
    -DBOARD_HAS_PSRAM=0
    -DHEXHOUND_QUIET_OPTIONAL_SD=1
    -DHEXHOUND_VENDOR_TFT=1
    -DHEXHOUND_DISABLE_LED=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_ignore =
    TFT_eSPI
lib_deps =
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^1.4.0

[env:lilygo-t-dongle-c5-vendor-app]
; Full HexHound firmware for the LilyGo T-Dongle C5.
; Uses the pioarduino ESP32 platform because LilyGo documents C5 support on
; Arduino 3.3.0 or newer, and the stock PlatformIO platform may lag C5 support.
;
; PINNED to a release, 2026-08-03. This was
;   platform = https://github.com/pioarduino/platform-espressif32.git#develop
; which made the C5 the ONLY target in this repo tracking a MOVING ref while the
; other six pinned versions. That is exactly why it was the only one of seven
; that broke while the rest rebuilt unchanged.
;
; The release pin fixes TWO moving refs, not one. `#develop` also resolves
; framework-arduinoespressif32 to `arduino-esp32/archive/master.zip`, so the
; Arduino core floated on master and could change from one build to the next.
; Release 55.03.311 pins the core to the 3.3.11 release tarballs instead.
; 3.3.11 satisfies LilyGo's documented "Arduino 3.3.0 or newer" for the C5.
;
; 55.03.311 is the same version `#develop` resolved to when this was pinned
; (55.3.311+develop.sha.9905818), so the pin is not a downgrade.
; Bump it deliberately; do not put a branch back here.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = lilygo_t_dongle_c5
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
board_build.cdc_on_boot = 1
; guard_c5_core_dir.py aborts the build unless PLATFORMIO_CORE_DIR is set,
; because this platform overwrites shared packages and silently breaks every
; ESP32-S3 target otherwise.
;
; scripts/bootstrap_pioarduino_tools.py used to run here too and was DELETED
; 2026-08-03. It existed to repair a toolchain package installed without its
; binaries: pioarduino's registry entry for toolchain-riscv32-esp is a
; 1643-byte zip holding only package.json and tools.json, an idf_tools manifest
; rather than a compiler. tool-esp_install now materializes the real toolchain
; into <core>/tools/ and re-registers the package from there, which REPLACES the
; manifest, so tools.json stops existing. The script probed for the repaired
; payload by hardcoded `.exe` name, so on Linux it never matched, decided repair
; was needed, and died reading the tools.json the correct install had just
; removed. That was the whole C5 failure, and it is why every CI run of this env
; failed while a by-hand Windows build passed: on Windows the `.exe` matched and
; the script returned early. Do not reintroduce it.
extra_scripts =
    pre:scripts/guard_c5_core_dir.py
build_src_filter =
    +<*>
    -<serial_test.cpp>
    -<tft_test.cpp>
    -<tft_espi_test.cpp>
    -<lilygo_vendor_baseline.cpp>
    -<hal/hal_sim.cpp>
    -<hal/sim_main.cpp>
    -<hal/sim_modules.cpp>
build_flags =
    -DHEXHOUND_BOARD_LILYGO_T_DONGLE_C5=1
    -DHEXHOUND_VENDOR_TFT=1
    -DHEXHOUND_DISABLE_LED=1
    -DHEXHOUND_USE_CORE_BLE=1
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFASTLED_FORCE_SOFTWARE_SPI
lib_ignore =
    TFT_eSPI
    FastLED
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:lilygo-t-dongle-c5-vendor-app-demo]
; Evolution DEMO build for the LilyGo T-Dongle C5. Plays one evolution
; cutscene on boot (current stage -> next) with all pet-state saves compiled
; out, so the stored stage/XP/stats are never modified.
extends = env:lilygo-t-dongle-c5-vendor-app
; Repeated on purpose - `extends` does not carry extra_scripts, so without this
; the env loses the core-dir guard.
extra_scripts =
    pre:scripts/guard_c5_core_dir.py
build_flags =
    ${env:lilygo-t-dongle-c5-vendor-app.build_flags}
    -DHEXHOUND_DEMO_EVOLVE=1
    -DHEXHOUND_NO_PERSIST=1

[env:lilygo-t-dongle-c5-ble-test]
; Temporary BLE validation build for the LilyGo T-Dongle C5. Forces the pet
; to Beacon Beast at runtime so BLE patrol scans are unlocked, while pet-state
; save calls are disabled to avoid persisting the staged-up pet.
extends = env:lilygo-t-dongle-c5-vendor-app
; Repeated on purpose - see the demo env above.
extra_scripts =
    pre:scripts/guard_c5_core_dir.py
build_flags =
    ${env:lilygo-t-dongle-c5-vendor-app.build_flags}
    -DHEXHOUND_NO_PERSIST=1
    -DHEXHOUND_FORCE_RUNTIME_STAGE=3

[env:t-dongle-s3-hid]
; HID mode - disables serial monitor, enables USB keyboard
; Use this for mission testing on real hosts
; WARNING: serial debug unavailable in this mode
;
; Based on the VENDOR display path, not the TFT_eSPI one. It used to extend
; lilygo-t-dongle-s3-safe, which is the TFT_eSPI stack that black-screens on
; this board (see docs/bugfix_log.md) - so the HID build ran fine and typed
; missions with nothing on the panel. Since it also has no serial console, that
; failure was invisible. The pet being visible is the point of the product.
extends = env:lilygo-t-dongle-s3-vendor-app
; Repeated on purpose - `extends` does not carry extra_scripts.
extra_scripts = pre:scripts/patch_arduino_sd.py
; The parent enables CDC-on-boot; HID mode must not, or the device tries to be
; both a serial port and a keyboard. Set here as well as via the -D flag so the
; board config and the macros cannot disagree.
board_build.cdc_on_boot = 0
build_flags =
    ${env:lilygo-t-dongle-s3-vendor-app.build_flags}
    -DUSB_MODE_HID=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:lilygo-t-dongle-s3-demo]
; Evolution DEMO build for the T-Dongle S3. Plays one evolution cutscene on
; boot (current stage -> next) with ALL pet-state saves compiled out, so the
; stored stage/XP/stats are never modified. Usage:
;   1. pio run -e lilygo-t-dongle-s3-demo -t upload --upload-port COM4
;   2. Watch the cutscene (POR: unplug/replug USB to replay).
;   3. pio run -e lilygo-t-dongle-s3-vendor-app -t upload --upload-port COM4  (revert)
; The pet is exactly as before -- nothing was persisted.
; NOTE: extends vendor-app (LilyGo esp_lcd/ST7735 backend), NOT the TFT_eSPI
; path -- TFT_eSPI black-screens on the T-Dongle S3 (see docs/bugfix_log.md).
; The vendor path ignores TFT_eSPI, so no REG_SPI_BASE patch is needed here.
extends = env:lilygo-t-dongle-s3-vendor-app
build_flags =
    ${env:lilygo-t-dongle-s3-vendor-app.build_flags}
    -DHEXHOUND_DEMO_EVOLVE=1

[env:lilygo-t-dongle-s3-ble-test]
; Temporary BLE validation build for the LilyGo T-Dongle S3. Forces the pet
; to Beacon Beast at runtime so BLE patrol scans are unlocked, while pet-state
; save calls are disabled to avoid persisting the staged-up pet.
extends = env:lilygo-t-dongle-s3-vendor-app
build_flags =
    ${env:lilygo-t-dongle-s3-vendor-app.build_flags}
    -DHEXHOUND_NO_PERSIST=1
    -DHEXHOUND_FORCE_RUNTIME_STAGE=3

