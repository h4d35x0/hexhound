; Waveshare ESP32-S3-LCD-1.28 - 240x240 round GC9A01A panel (NON-touch variant).
;
; Board notes that differ from every other env in this file:
;   * ESP32-S3R2 = 2 MB QUAD PSRAM, so memory_type is qio_qspi (NOT qio_opi).
;     Using the 1.47B board's qio_opi here does not boot.
;   * USB-C is a CH343P USB-to-UART bridge, not a native USB device port, so
;     cdc_on_boot is 0 and Serial comes out of UART0 on GPIO43/44. There is no
;     USB HID capability - the missions subsystem is filtered out below.
;   * The sibling ESP32-S3-Touch-LCD-1.28 uses TFT_RST=14 / TFT_BL=2 and adds a
;     CST816S touch panel. These pins are for the non-touch board only.
;   * GC9A01 is a full 240x240 RAM panel, so no CGRAM_OFFSET.
;   * patch_tft_espi.py is what makes FSPI work on the S3 (the REG_SPI_BASE
;     fix); it is why this env does not need the USE_HSPI_PORT workaround that
;     the upstream TFT_eSPI threads recommend for this board.
platform = espressif32@6.12.0
board = waveshare_esp32_s3_lcd_128
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
board_build.cdc_on_boot = 0
extra_scripts = pre:scripts/patch_tft_espi.py
build_src_filter =
    +<*>
    -<serial_test.cpp>
    -<tft_test.cpp>
    -<tft_espi_test.cpp>
    -<lilygo_vendor_baseline.cpp>
    -<esp_lcd_st7735.c>
    -<hal/hal_sim.cpp>
    -<hal/sim_main.cpp>
    -<hal/sim_modules.cpp>
build_flags =
    -DHEXHOUND_BOARD_WAVESHARE_LCD_128=1
    -DHEXHOUND_DISABLE_LED=1
    -DBOARD_HAS_PSRAM=1
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=10
    -DTFT_CS=9
    -DTFT_DC=8
    -DTFT_RST=12
    -DTFT_BL=40
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^1.4.0

[env:waveshare-esp32-s3-lcd-128-demo]
; Evolution-cutscene demo build for the round board.
extends = env:waveshare-esp32-s3-lcd-128
; extra_scripts is repeated on purpose: `extends` does NOT carry it, and
; without patch_tft_espi.py this build boot-loops on tft->init().
extra_scripts = pre:scripts/patch_tft_espi.py
build_flags =
    ${env:waveshare-esp32-s3-lcd-128.build_flags}
    -DHEXHOUND_DEMO_EVOLVE=1

[env:waveshare-esp32-s3-lcd-128-ble-test]
; Passive BLE/WiFi scan validation on the round board. This is the tightest-RAM
; S3 in the fleet (2 MB quad PSRAM vs 8 MB OPI elsewhere), so the scan path is
; worth exercising here specifically.
extends = env:waveshare-esp32-s3-lcd-128
extra_scripts = pre:scripts/patch_tft_espi.py
build_flags =
    ${env:waveshare-esp32-s3-lcd-128.build_flags}
    -DHEXHOUND_NO_PERSIST=1
    -DHEXHOUND_FORCE_RUNTIME_STAGE=3

[env:serial-test]
; Bare-minimum serial test - isolates USB CDC from all HexHound code
; Build: pio run -e serial-test
; Flash: python upload_watchdog.py --env serial-test
;    OR: pio run -e serial-test -t upload (then unplug/replug USB)
; Monitor: pio device monitor -b 115200
platform = espressif32@6.12.0   ; pinned - see [env:lilygo-t-dongle-s3]
board = dongles3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DBOARD_HAS_PSRAM=0
build_src_filter =
    +<serial_test.cpp>
lib_deps =

[env:tft-test]
; Minimal TFT test - ONLY FastLED + TFT_eSPI, nothing else
; Isolates TFT init from NimBLE, WiFi, SD, USB libraries
; Build: pio run -e tft-test
; Flash: pio run -e tft-test -t upload --upload-port <PORT>
platform = espressif32@6.12.0   ; pinned - see [env:lilygo-t-dongle-s3]
board = dongles3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
board_build.cdc_on_boot = 1
build_flags =
    -DBOARD_HAS_PSRAM=0
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DST7735_GREENTAB160x80=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=27000000
    -DTFT_RGB_ORDER=TFT_BGR
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
build_src_filter =
    +<tft_test.cpp>
lib_deps =

[env:tft-espi-test]
; Minimal TFT_eSPI test - isolates the library path used by the full app.
; Uses TFT_eSPI directly, with LED disabled, and cycles colors/text/rotations.
extends = env:lilygo-t-dongle-s3-safe
build_src_filter =
    +<tft_espi_test.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.0

[sim_common]
; Shared, OS-independent settings for every SDL2 desktop simulator env.
; Only the SDL2 discovery flags differ per OS, so the source filter and the
; library list live here once and cannot drift between the Windows and Linux
; builds. The filter drops every hardware-only module (radios, USB HID, SD,
; notifications, hardware validator) plus the on-target HAL; sim replacements
; live in src/hal/sim_modules.cpp.
build_flags =
    -DSIMULATOR_BUILD
    -DDESKTOP_SIM=1
    -DLED_DATA_PIN=40
    -DLED_CLK_PIN=39
    -DNUM_LEDS=1
    -std=c++17
build_src_filter =
    +<*>
    -<lilygo_vendor_baseline.cpp>
    -<esp_lcd_st7735.c>
    -<serial_test.cpp>
    -<tft_test.cpp>
    -<tft_espi_test.cpp>
    -<modules/wifi_module.cpp>
    -<modules/ble_module.cpp>
    -<modules/usb_module.cpp>
    -<modules/storage_module.cpp>
    -<modules/notif_module.cpp>
    -<diagnostics/hw_validator.cpp>
    -<hal/hal_hardware.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:desktop-sim]
; SDL2 desktop simulator (Windows / MinGW) - no hardware required
; Requires MinGW: install via MSYS2
; pacman -S mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2
; Add C:\msys64\mingw64\bin to Windows PATH
; Build: pio run -e desktop-sim
; Run: .pio/build/desktop-sim/program.exe
platform = native
; compiler_type = gcc (MinGW g++ must be on PATH)
build_flags =
    ${sim_common.build_flags}
    -IC:/msys64/mingw64/include/SDL2
    -LC:/msys64/mingw64/lib
    -lSDL2
    -lm
build_src_filter = ${sim_common.build_src_filter}
lib_deps = ${sim_common.lib_deps}

[env:desktop-sim-wave]
; SDL2 desktop simulator (Windows) built for the Waveshare 320x172 panel.
; Same toolchain as desktop-sim; only the board profile (screen size) differs.
; Build: pio run -e desktop-sim-wave   Run: .pio/build/desktop-sim-wave/program.exe
extends = env:desktop-sim
build_flags =
    ${env:desktop-sim.build_flags}
    -DHEXHOUND_BOARD_WAVESHARE_147B=1

[env:desktop-sim-round]
; SDL2 desktop simulator (Windows) built for the Waveshare 240x240 round panel.
; Same toolchain as desktop-sim; only the board profile (screen size + round
; layout family) differs. The sim masks off the pixels the real glass hides, so
; what you see here is what the bezel actually shows.
; Build: pio run -e desktop-sim-round   Run: .pio/build/desktop-sim-round/program.exe
extends = env:desktop-sim
build_flags =
    ${env:desktop-sim.build_flags}
    -DHEXHOUND_BOARD_WAVESHARE_LCD_128=1

[env:desktop-sim-round480]
; SDL2 desktop simulator (Windows) built for the LilyGo T-RGB 480x480 round
; panel. Same round layout family as desktop-sim-round, four times the pixels.
;
; This is where the 480 layouts get iterated: the board itself is only needed to
; confirm colour and timing, and everything about chord fitting, text scale and
; the vertical rhythm is identical in the sim. HEXHOUND_RGB_PANEL is NOT set
; here - the sim has its own display backend and never touches esp_lcd.
; Build: pio run -e desktop-sim-round480   Run: .pio/build/desktop-sim-round480/program.exe
extends = env:desktop-sim
build_flags =
    ${env:desktop-sim.build_flags}
    -DHEXHOUND_BOARD_LILYGO_T_RGB=1
    ; The T-RGB carries 8 MB of octal PSRAM, so it is a TIER_RICH board. On
    ; hardware BOARD_HAS_PSRAM comes from the PlatformIO board definition, which
    ; a native build never sees - so without this the simulator reported
    ; tier=core while the board it is simulating reported tier=rich, and every
    ; tiered screen was rendered at the wrong size. The den was the visible
    ; case: the sim drew DEN_SLOTS_CORE = 3 places and the board drew 8, so a
    ; den screenshot from here was a picture of a smaller room than the one
    ; being reported from the glass. Caps::tier() is the only reader.
    -DBOARD_HAS_PSRAM=1

[env:desktop-sim-linux]
; SDL2 desktop simulator (Linux) - no hardware required.
; Deps (Kali/Debian/Ubuntu):
;   sudo apt install build-essential libsdl2-dev pkg-config
; Build: pio run -e desktop-sim-linux
; Run:   .pio/build/desktop-sim-linux/program
; SDL2 is resolved through pkg-config rather than hardcoded paths so the same
; env builds on any distro. PlatformIO runs a build_flags entry starting with
; `!` as a shell command and substitutes its output.
platform = native
; Statically links libstdc++/libgcc so the packaged sim runs on a machine with
; no toolchain. Must be an extra_script: PlatformIO drops unrecognised
; build_flags into CCFLAGS, where they never reach the link step.
extra_scripts = pre:scripts/sim_linux_linkflags.py
build_flags =
    ${sim_common.build_flags}
    !pkg-config --cflags sdl2
    !pkg-config --libs sdl2
    -lm
build_src_filter = ${sim_common.build_src_filter}
lib_deps = ${sim_common.lib_deps}

[env:desktop-sim-wave-linux]
; SDL2 desktop simulator (Linux) built for the Waveshare 320x172 panel.
; Same toolchain as desktop-sim-linux; only the board profile differs.
; Build: pio run -e desktop-sim-wave-linux
; Run:   .pio/build/desktop-sim-wave-linux/program
extends = env:desktop-sim-linux
; extra_scripts is repeated on purpose: `extends` does not reliably carry it
; (same trap as the Waveshare demo envs above), and without it this env links
; against the shared libstdc++.
extra_scripts = pre:scripts/sim_linux_linkflags.py
build_flags =
    ${env:desktop-sim-linux.build_flags}
    -DHEXHOUND_BOARD_WAVESHARE_147B=1

[env:desktop-sim-round-linux]
; SDL2 desktop simulator (Linux) built for the Waveshare 240x240 round panel.
; Build: pio run -e desktop-sim-round-linux
; Run:   .pio/build/desktop-sim-round-linux/program
extends = env:desktop-sim-linux
; extra_scripts is repeated on purpose: `extends` does not reliably carry it.
extra_scripts = pre:scripts/sim_linux_linkflags.py
build_flags =
    ${env:desktop-sim-linux.build_flags}
    -DHEXHOUND_BOARD_WAVESHARE_LCD_128=1

[env:native]
; Native test runner (requires MinGW g++ on PATH)
; Tests discovered from test/ directory (PlatformIO default)
platform = native
test_build_src = no
build_flags =
    -DSIMULATOR_BUILD
    -DUNIT_TEST
    -DLED_DATA_PIN=40
    -DLED_CLK_PIN=39
    -DNUM_LEDS=1
    -std=c++17
    -lm
build_src_filter =
    -<*>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:lilygo-t-dongle-s3-diag-perpixel]
; DIAGNOSTIC ONLY - not a shipping target.
; Same as the vendor app but with drawSprite() using the pre-HD per-pixel path,
; to isolate whether the HD span-batching is what wedges the vendor esp_lcd
; panel on the T-Dongle S3. Delete once that is settled.
extends = env:lilygo-t-dongle-s3-vendor-app
extra_scripts = pre:scripts/patch_arduino_sd.py
build_flags =
    ${env:lilygo-t-dongle-s3-vendor-app.build_flags}
    -DHEXHOUND_DIAG_SPRITE_PER_PIXEL=1

[env:t-dongle-s3-hid-mission-test]
; HID mission testing without grinding a pet to Gremlin.
; HEXHOUND_FORCE_RUNTIME_STAGE=4 stages the pet in RAM only (main.cpp clears the
; dirty flag) and HEXHOUND_NO_PERSIST compiles out the saves, so the stored
; stage/XP are untouched - same guarantee as the evolution demo builds.
; The Missions menu entry only exists at stage >= GREMLIN (ui_menu.cpp:50).
extends = env:t-dongle-s3-hid
extra_scripts = pre:scripts/patch_arduino_sd.py
board_build.cdc_on_boot = 0
build_flags =
    ${env:t-dongle-s3-hid.build_flags}
    -DHEXHOUND_FORCE_RUNTIME_STAGE=4
    -DHEXHOUND_NO_PERSIST=1

[env:waveshare-esp32-s3-lcd-128-stepcap]
; DIAGNOSTIC build for calibrating the step detector on the round 1.28 board.
;
; Records the RAW accelerometer stream the detector is fed during a roam, holds it
; in RAM, and writes it to SPIFFS once when the roam ends. Dumped over serial on
; the next boot between [STEPCAP] BEGIN / END markers.
;
; Capturing the INPUT rather than the detector's verdict is the whole point: it
; lets candidate tuning constants be swept offline against one real counted walk,
; instead of costing a walk per candidate.
;
; NOT for shipping. src/diagnostics/step_capture.* compiles to inline no-ops
; without HEXHOUND_STEP_CAPTURE, so no release image carries any of it.
extends = env:waveshare-esp32-s3-lcd-128
; Repeated on purpose - `extends` does NOT carry extra_scripts, and without the
; TFT_eSPI REG_SPI_BASE patch this board boot-loops on tft->init().
extra_scripts = pre:scripts/patch_tft_espi.py
build_flags =
    ${env:waveshare-esp32-s3-lcd-128.build_flags}
    -DHEXHOUND_STEP_CAPTURE=1

[env:lilygo-t-rgb-bringup]
; DIAGNOSTIC bring-up for the LilyGo T-RGB (2.1" half circle, marked H583).
;
; This board is not a new pin map on a known stack, it is a new display stack:
; an ST7701S 480x480 driven by the S3's RGB parallel LCD peripheral, with the
; panel's own SPI init lines hanging off an XL9535 I2C expander. TFT_eSPI
; cannot drive it, so none of the patch_tft_espi.py machinery applies here.
;
; Fully standalone, following the [env:serial-test] pattern: build_src_filter
; names exactly one file and lib_deps is empty, so this env shares nothing
; with the seven boards that already build and cannot regress them.
;
; The 2.1" panel exists in two electrically different revisions that disagree
; about the RGB data pin map, the pixel clock and the porch timings. The
; sketch cycles through the candidates; whichever renders a clean test pattern
; is the board's true identity. Press any key over serial to advance.
;
; NOT for shipping. No release image includes this translation unit.
platform = espressif32@6.12.0   ; pinned - an unpinned slot gets clobbered by pioarduino
board = lilygo_t_rgb
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.cdc_on_boot = 1
build_src_filter =
    +<diagnostics/trgb_bringup.cpp>
build_flags =
    -DHEXHOUND_TRGB_BRINGUP=1
    -DBOARD_HAS_PSRAM=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =

[env:lilygo-t-rgb]
; LilyGo T-RGB - ST7701S 480x480 round panel on the S3's RGB PARALLEL LCD
; peripheral, with the framebuffer in PSRAM. FT3267 capacitive touch.
;
; This board shares none of the SPI display machinery. TFT_eSPI cannot drive an
; RGB parallel panel, so there is no TFT_eSPI dependency and no
; patch_tft_espi.py here; src/hal/tft_compat_rgb.cpp provides the same
; TFT_eSPI-shaped surface over a PSRAM canvas instead.
;
; Panel config is the one confirmed on glass during bring-up: V1 init table,
; V1 data pin map, 8 MHz pclk, RGB colour order. [env:lilygo-t-rgb-bringup]
; still cycles all four candidates if another unit ever disagrees.
;
; 8 MB OCTAL PSRAM is not optional: the 480x480 RGB565 canvas is 460800 bytes
; and the panel's own framebuffer is another 460800, so memory_type MUST be
; qio_opi.
platform = espressif32@6.12.0   ; pinned - an unpinned slot gets clobbered by pioarduino
board = lilygo_t_rgb
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.cdc_on_boot = 1
build_src_filter =
    +<*>
    -<serial_test.cpp>
    -<tft_test.cpp>
    -<tft_espi_test.cpp>
    -<lilygo_vendor_baseline.cpp>
    -<esp_lcd_st7735.c>
    -<hal/hal_sim.cpp>
    -<hal/sim_main.cpp>
    -<hal/sim_modules.cpp>
build_flags =
    -DHEXHOUND_BOARD_LILYGO_T_RGB=1
    -DHEXHOUND_RGB_PANEL=1
    ; -DHEXHOUND_RGB_SELFTEST=1   ; uncomment for a boot R/G/B field + per-blit log
    -DHEXHOUND_DISABLE_LED=1
    -DBOARD_HAS_PSRAM=1
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^1.4.0

[env:lilygo-t-rgb-hid-demo]
; FILMING build for the HID missions, and nothing else. Not a release image.
;
; Identical to [env:lilygo-t-rgb-hid] except that it can reach the screen being
; filmed. MISSIONS is gated on STAGE_GREMLIN by menuItemVisible(), and the bench
; T-RGB is a Packet Pup with 241 XP against a 900 XP threshold, so the row it is
; meant to demonstrate cannot be opened at all on the real pet.
;
; The two flags below are a PAIR and must not be separated:
;   HEXHOUND_DEMO_STAGE=4  forces the stage in RAM at boot (see main.cpp).
;   HEXHOUND_NO_PERSIST=1  makes savePetState() return early and clear dirty.
; Without the second one, the mission-success path in the SCREEN_MISSION_BRIEF
; handler saves, and filming a demo would permanently promote a real pet from
; Packet Pup to Gremlin Mode. Eight save sites call savePetState(); suppressing
; it inside the function is the only version that provably covers all of them.
;
; Inherits the console warning from its parent: this image is a keyboard, not a
; serial port. Re-flash by holding BOOT while plugging in.
extends = env:lilygo-t-rgb-hid
build_flags =
    ${env:lilygo-t-rgb-hid.build_flags}
    -DHEXHOUND_DEMO_STAGE=4
    -DHEXHOUND_NO_PERSIST=1

[env:lilygo-t-rgb-hid]
; HID mode for the LilyGo T-RGB - USB keyboard instead of a serial port.
;
; The T-RGB is the first ROUND board that can do this. The Waveshare 1.28
; reaches its USB-C through a CH343P UART bridge, so it has no USB device at
; all and menuItemVisible() hides MISSIONS there. The T-RGB's USB-C is the
; S3's native port, so HEXHOUND_HAS_USB_HID is 1 and the row is offered. Until
; this env existed the row was offered and nothing could ever come of it: no
; shipping T-RGB image defined USB_MODE_HID, so executeMission() returned false
; and the UI went quietly home.
;
; WARNING - THIS IMAGE HAS NO CONSOLE, so a failure in it is INVISIBLE.
; ARDUINO_USB_CDC_ON_BOOT=0 moves Serial off the USB port and onto UART0
; (GPIO43/44); the USB port is a keyboard from boot. Nothing prints anywhere
; you can see it without a UART adapter on those pins. Two consequences:
;   1. The PANEL is the only status indicator, so this env extends
;      [env:lilygo-t-rgb] - the exact display path confirmed on glass - and
;      changes NOTHING but the USB flags. This is the lesson from
;      [env:t-dongle-s3-hid], which used to extend the TFT_eSPI stack that
;      black-screens on that board: it typed missions perfectly at a dead
;      panel, with no console to say so.
;   2. Re-flashing needs the ROM download mode, not the app's USB stack. Hold
;      BOOT while plugging in, then upload as usual. The board is not bricked;
;      it is simply not a serial port any more.
;
; The parent has no `extra_scripts` to lose (no TFT_eSPI here - the ST7701S
; runs on the RGB parallel peripheral), so there is nothing to repeat. If one
; is ever added to [env:lilygo-t-rgb], repeat it here: `extends` does not carry
; extra_scripts, and an unpatched framework is another silent boot loop in an
; image that cannot report one.
extends = env:lilygo-t-rgb
; The parent enables CDC-on-boot; HID mode must not, or the device tries to be
; both a serial port and a keyboard. Set here as well as via the -D flag so the
; board config and the macros cannot disagree.
board_build.cdc_on_boot = 0
; Inherited from the parent and restated, because getting it wrong is exactly
; the failure this env cannot report. The 480x480 RGB565 canvas is 460800 bytes
; and the panel framebuffer another 460800; without OCTAL PSRAM neither exists,
; the panel stays dark, and there is no console to say why.
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env:lilygo-t-rgb.build_flags}
    -DUSB_MODE_HID=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:lilygo-t-rgb-hid-diag]
; DIAGNOSTIC twin of [env:lilygo-t-rgb-hid]. A bench instrument, not an image.
;
; WHY THIS EXISTS. On 2026-09-01 the T-RGB running the HID demo image caused a
; stuck-modifier incident on the owner's laptop, and was then seen connecting
; and immediately disconnecting on USB, over and over, on every port and every
; cable he tried. Repeated re-enumeration means the board was resetting.
; Reflashing [env:lilygo-t-rgb] gave a stable port, so whatever it is looks
; specific to the HID image - and the HID image is the one whose own comment
; says "THIS IMAGE HAS NO CONSOLE, so a failure in it is INVISIBLE." That
; warning came true; nobody could see why the board was resetting.
;
; So this env keeps ARDUINO_USB_MODE=0 (TinyUSB, the same USB stack the HID
; image runs) but turns CDC-on-boot back ON. Serial then becomes the TinyUSB
; USBCDC rather than UART0, and a panic, a boot loop or a watchdog finally
; prints somewhere the owner can read without soldering to GPIO43/44.
; Confirmed in the framework: USBCDC.h:141 binds `extern USBCDC Serial` under
; exactly `#if ARDUINO_USB_CDC_ON_BOOT && !ARDUINO_USB_MODE`, which is this
; combination and no other. No shipping env in this project uses it: every
; board here is ARDUINO_USB_MODE=1 in its normal image (hardware
; USB-Serial-JTAG, HWCDC) - all six JSONs in boards/ hard-code it and
; [env:lilygo-t-display-s3] sets it in build_flags - and the two HID envs are
; mode 0 with CDC off.
;
; NEVER SHIP IT AND NEVER LEAVE IT ON A BOARD. It exists to be flashed, to
; answer one question, and to be flashed over with [env:lilygo-t-rgb] or
; [env:lilygo-t-rgb-hid] the same day. It is a keyboard build, so it carries
; every risk the HID envs carry, on a USB configuration that no unit has ever
; been shipped with.
;
; HARD DEPENDENCY - THIS ENV DOES NOT WORK ON ITS OWN. It requires the keyboard
; in src/modules/usb_module.cpp to be declared at FILE SCOPE. Setting
; cdc_on_boot to 1 on the HID flags WITHOUT that change gives you a working
; console and a DEAD KEYBOARD: the port enumerates, the image boots, the mission
; rows appear, and not one keystroke ever reaches the host. Do not recreate this
; env from the flags alone. This paragraph stays even once the usb_module.cpp
; side is in place, because the flags on their own still look sufficient and are
; not.
;
; Why. There is no capacity problem - the framework supports composite CDC+HID,
; esp32-hal-tinyusb.c raises its endpoint budget to 5 IN endpoints when CDC is
; loaded, CDC reserves OUT3/IN4/IN5, HID takes one free IN and one free OUT, and
; sdkconfig has both CONFIG_TINYUSB_CDC_ENABLED and CONFIG_TINYUSB_HID_ENABLED.
; What breaks it is ORDER:
;   1. USB.h:23 defines ARDUINO_USB_ON_BOOT as the OR of the three ON_BOOT
;      macros, so ARDUINO_USB_CDC_ON_BOOT=1 alone makes it true.
;   2. The core's app_main() then runs Serial.begin() (main.cpp:58) and
;      USB.begin() -> tinyusb_init() (main.cpp:67) under
;      `#if ARDUINO_USB_ON_BOOT && !ARDUINO_USB_MODE`, BEFORE initArduino() and
;      before loopTask and setup() exist at all.
;   3. tinyusb_enable_interface() (esp32-hal-tinyusb.c:661-664) then refuses
;      outright: it logs "TinyUSB has already started! Interface HID not
;      enabled" and returns ESP_FAIL.
;   4. The HID interface is registered by the USBHID CONSTRUCTOR
;      (USBHID.cpp:285). A `new USBHIDKeyboard()` inside USBModule::init(),
;      which is STEP 13 of setup(), runs long after step 3 has shut the door.
;      At file scope that same constructor runs in do_global_ctors(), ahead of
;      app_main(), and the interface registers normally.
; The whole failure is ONE log line. It compiles clean, it enumerates, and it is
; invisible on this env's own console as well: the core reports it with log_e(),
; and log_e() goes through log_printf() -> ets_printf() -> the IDF console,
; which sdkconfig pins to UART0, not to the CDC port. A silent failure in an
; image that cannot report one is the exact class of bug this env exists to
; eliminate, so it must never be this env's own first bug. Do not read a quiet
; run here as "HID is fine" - press a key and confirm the host sees it.
;
; The two existing HID envs are NOT affected and need no change: they set
; ARDUINO_USB_CDC_ON_BOOT=0, so ARDUINO_USB_ON_BOOT is false, app_main() begins
; nothing, and the USB.begin() inside USBModule::init() is the only one.
; Calling USB.begin() twice is not a problem in any case: ESPUSB::begin() is
; guarded by _started and tinyusb_init() returns ESP_OK early, so the call in
; USBModule::init() is a harmless no-op here.
;
; DO NOT ADD Serial.flush() AND DO NOT ADD Serial.setTxTimeoutMs(0).
; The long comment at src/main.cpp:322-372 records what both cost. A single
; flush() before tft->init() waited on a host that had the port open and was
; not draining it; one boot took 443696 ms and looked exactly like a dead
; board. setTxTimeoutMs(0) was then tried and deliberately REJECTED, because it
; makes writes give up and drop lines, which is precisely the diagnostics this
; env exists to collect. USBCDC is no gentler than HWCDC about this:
; USBCDC::write() spins on tud_cdc_n_write_flush() for as long as the host
; stays connected without reading, and tx_timeout_ms only bounds acquiring the
; TX lock, not that spin. Audited at this commit, the only flush() left on any
; path this env compiles is main.cpp:2544, immediately before ESP.restart() on
; the OTA path, so it is not on the boot path.
;
; Two things the console will not do for you. USBCDC::write() returns 0 when no
; host has the port open, so anything printed before a terminal is attached is
; dropped, not buffered; if you are chasing a fault in the first second, open
; the terminal first and then reset the board. And unlike its parent, this
; image can be re-flashed WITHOUT holding BOOT: USBCDC honours the DTR/RTS
; knock and the 1200 bps touch and restarts into the ROM bootloader
; (USBCDC.cpp:229 and :258). Holding BOOT still works, and is still the answer
; if it stops enumerating at all.
;
; On board_build.cdc_on_boot: espressif32@6.12.0 does not read that key -
; nothing in its builder mentions it. The macro is what decides, and
; boards/lilygo_t_rgb.json hard-codes -DARDUINO_USB_MODE=1 and
; -DARDUINO_USB_CDC_ON_BOOT=1 in build.extra_flags, which env build_flags land
; after and override. It is set below anyway so the intent cannot be misread,
; and so this env stays right if the platform is ever moved to one that honours
; it. The macro redefinition warnings that produces are the same ones
; [env:lilygo-t-rgb-hid] already emits on every translation unit.
;
; Inherits the parent's flags wholesale on purpose, so any flag added to
; [env:lilygo-t-rgb-hid] reaches this env too; the single -D below lands last
; and is the only difference between the two images.
extends = env:lilygo-t-rgb-hid
board_build.cdc_on_boot = 1
build_flags =
    ${env:lilygo-t-rgb-hid.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
