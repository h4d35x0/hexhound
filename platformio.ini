[env:waveshare-esp32-s3-lcd-147b-demo]
; Evolution DEMO build. Plays one evolution cutscene on boot (current stage ->
; next) with ALL pet-state saves compiled out, so the stored stage/XP/stats are
; never modified. Usage:
;   1. pio run -e waveshare-esp32-s3-lcd-147b-demo -t upload --upload-port COM15
;   2. Watch the cutscene (replug USB to replay).
;   3. pio run -e waveshare-esp32-s3-lcd-147b -t upload --upload-port COM15  (revert)
; The pet is exactly as before -- nothing was persisted.
extends = env:waveshare-esp32-s3-lcd-147b
; extra_scripts must be repeated: `extends` does NOT reliably carry them, and
; without them this env's separate libdeps copy of TFT_eSPI misses the
; REG_SPI_BASE patch while optional-SD probes stay noisy when no card exists.
extra_scripts =
    pre:scripts/patch_tft_espi.py
    pre:scripts/patch_arduino_sd.py
build_flags =
    ${env:waveshare-esp32-s3-lcd-147b.build_flags}
    -DHEXHOUND_DEMO_EVOLVE=1

[env:waveshare-esp32-s3-lcd-147b-demo-sentinel]
; The showpiece evolution: Gremlin -> Sentinel (stage 4 -> 5), the
; pair with the most detail in the HD art. Same no-persist guarantee as the
; plain demo env - HEXHOUND_FORCE_RUNTIME_STAGE only stages the pet in RAM
; (main.cpp clears the dirty flag), and HEXHOUND_DEMO_EVOLVE compiles out every
; save call, so the stored stage/XP are untouched.
;   pio run -e waveshare-esp32-s3-lcd-147b-demo-sentinel -t upload --upload-port COM15
;   replug USB to replay; revert with the plain waveshare-esp32-s3-lcd-147b env
extends = env:waveshare-esp32-s3-lcd-147b-demo
; Repeated on purpose - `extends` does not carry extra_scripts, and without the
; TFT_eSPI patch this env's separate libdeps copy boot-loops on tft->init().
extra_scripts =
    pre:scripts/patch_tft_espi.py
    pre:scripts/patch_arduino_sd.py
build_flags =
    ${env:waveshare-esp32-s3-lcd-147b-demo.build_flags}
    -DHEXHOUND_FORCE_RUNTIME_STAGE=4

